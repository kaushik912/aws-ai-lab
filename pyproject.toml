[project]
name = "aws-ai-lab"
version = "0.1.0"
description = "Cost-optimized RAG + agent on AWS (FastAPI + Bedrock + FAISS/BM25 + Lambda)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "boto3>=1.35",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "langgraph>=0.2",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
